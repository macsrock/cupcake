[package]
name = "zcash_signer"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
description = "Airgapped Zcash PCZT signer (transparent + Orchard/Ironwood) for Cupcake"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
pczt = { version = "0.9", features = ["signer", "orchard", "sapling", "transparent"] }
zcash_keys = { version = "0.16", features = ["orchard", "sapling", "transparent-inputs"] }
zcash_protocol = "0.10"
zcash_address = "0.13"
zip32 = "0.2"
orchard = { version = "0.15", default-features = false }
sapling-crypto = { version = "0.7", default-features = false }
transparent = { package = "zcash_transparent", version = "0.10" }
bip32 = { version = "0.6.0-pre.1", default-features = false }
secp256k1 = "0.29"
ripemd = "0.1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bip39 = "2"

[dev-dependencies]
hex = "0.4"
pczt = { version = "0.9", features = ["signer", "orchard", "sapling", "transparent", "io-finalizer", "zcp-builder"] }
zcash_primitives = { version = "0.30", features = ["transparent-inputs"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
lto = true
opt-level = "z"
panic = "abort"
